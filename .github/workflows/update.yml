name: Update Chronoctl

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Stable upstream version, with or without the leading v
        required: false
        type: string

concurrency:
  group: update-chronoctl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      branch: ${{ steps.update.outputs.branch }}
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare update
        id: update
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            ruby script/update.rb "$REQUESTED_VERSION"
          else
            ruby script/update.rb
          fi

          git add Formula
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Chronoctl is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version="$(sed -nE 's|.*refs/tags/v([0-9.]+)\.tar\.gz.*|\1|p' Formula/chronoctl.rb)"
          branch="automation/chronoctl-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chronoctl $version"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Publish latest formula
        env:
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          # A normal push rejects concurrent main changes; never overwrite them.
          git push origin HEAD:refs/heads/main
          git push origin --delete "$CANDIDATE_BRANCH"
          echo "Published validated Chronoctl update to main." >> "$GITHUB_STEP_SUMMARY"
