name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: true
          cask: false

      - name: Check style
        run: |
          formulae=()
          while IFS= read -r path; do
            formulae+=("vapiai/chronoctl/$(basename "$path" .rb)")
          done < <(find Formula -name '*.rb' -type f | sort)
          brew style --formula "${formulae[@]}"

      - name: Audit latest formula
        run: brew audit --strict --new --online vapiai/chronoctl/chronoctl
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      - name: Audit versioned formulae
        run: |
          formulae=()
          while IFS= read -r path; do
            formulae+=("vapiai/chronoctl/$(basename "$path" .rb)")
          done < <(find Formula -name 'chronoctl@*.rb' -type f | sort)
          brew audit --strict --online "${formulae[@]}"
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      - name: Build and install
        run: brew install --build-from-source vapiai/chronoctl/chronoctl

      - name: Test
        run: brew test vapiai/chronoctl/chronoctl

  test-versioned:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: true
          cask: false

      - name: Build and test versioned formulae
        run: |
          while IFS= read -r path; do
            formula="vapiai/chronoctl/$(basename "$path" .rb)"
            brew install --build-from-source "$formula"
            brew test "$formula"
            brew uninstall "$formula"
          done < <(find Formula -name 'chronoctl@*.rb' -type f | sort)
